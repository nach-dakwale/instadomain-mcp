[project]
name = "instadomain"
version = "1.0.0"
description = "MCP server for domain registration. AI agents check, buy, and configure domains."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Nach Dakwale", email = "nach@nachdakwale.com" },
]
keywords = ["mcp", "domains", "ai-agents", "dns", "cloudflare", "stripe", "x402"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Name Service (DNS)",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi[standard]>=0.100",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "stripe>=8.0",
    "cryptography>=42.0",
    "slowapi>=0.1",
    "fastmcp>=2.0",
    "x402[fastapi,evm,httpx]>=2.0",
    "pympp>=0.7",
]

[project.urls]
Homepage = "https://instadomain.fly.dev"
Repository = "https://github.com/nach-dakwale/instadomain-mcp"
